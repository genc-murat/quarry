version: 2
updates:
  # The workflows pin every action to a commit SHA (a moved tag in a job that
  # holds the updater signing key would be a way to ship a signed malicious
  # update), so upgrades have to be proposed rather than followed automatically.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
