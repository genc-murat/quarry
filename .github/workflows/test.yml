name: tests

on:
  push:
  pull_request:

# Both jobs only read the repository.
permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No native build step is involved: the checks are tsc plus Node's own
      # test runner, so install scripts (tauri CLI, esbuild binary) are skipped
      # to keep the job quick.
      - run: npm ci --ignore-scripts
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test

  rust:
    # 22.04 is the oldest runner that ships WebKitGTK 4.1, which Tauri 2 links
    # against; building here also keeps the Linux binaries' glibc floor low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The `tauri` crate links the system webview, so even a check needs these.
      - name: Install the webview and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Pinned to a commit on the action's master branch, which is what its
      # README requires of a SHA pin; the toolchain then has to be named.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # `generate_context!` requires the `frontendDist` folder to exist even for
      # a check or a test build, and `dist` is a build artefact the repository
      # does not carry. An empty one satisfies the macro — debug builds embed no
      # assets — and the real one is produced by the release workflow's own
      # `npm run build`.
      - run: mkdir -p dist

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      # Lints are reported, not gated: the tree still carries a few pre-existing
      # ones, so `-D warnings` would fail every run until they are cleared.
      # `--locked` everywhere else: the committed Cargo.lock is the contract, and
      # a stale one should fail here rather than silently re-resolve.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # The driver descriptors are a contract between the two languages: the
      # Rust half (above) checks the snapshot against the registry, and this
      # checks the frontend fixtures against the snapshot.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test src/lib/fixtureDrift.test.ts
