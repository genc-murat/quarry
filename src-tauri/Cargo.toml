[package]
name = "quarry"
version = "0.1.0"
description = "Quarry — a modular, themeable database studio"
authors = ["Quarry"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "quarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
aes-gcm = "0.10"
futures-util = "0.3"
percent-encoding = "2"
redis = { version = "1", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
  "tokio-rustls-comp",
] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "bigdecimal",
  "json",
  "uuid",
] }
mongodb = "3"
clickhouse = { version = "0.13", default-features = false, features = [
  "rustls-tls-ring",
  "rustls-tls-native-roots",
] }

# Update delivery is a desktop concern: the updater reads a release manifest and
# the process plugin restarts the app into the version it just installed.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native open/save dialogs for SQL scripts (the disk half is `src/scripts.rs`).
tauri-plugin-dialog = "2"

[dev-dependencies]
# The verifier `tauri-plugin-updater` calls, so a test can check the release
# check's signature fixture with the same code the app runs rather than with a
# second reading of the format. Cargo resolves one version for both.
minisign-verify = "0.3"

[features]
# Used by tauri-build to enable the custom protocol on mobile targets.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
